[workspace]
resolver = "3"
members = ["crates/kelp-core", "crates/kelp"]

[workspace.package]
version = "0.8.17"
edition = "2024"
license = "MIT"

[workspace.dependencies]
kelp-core = { path = "crates/kelp-core" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
